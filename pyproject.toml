[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ebs"
version = "0.1.0.dev0"
description = "EDA Build System: hash-based build orchestrator for EDA flows on SLURM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "structlog>=24.1",
    "pydantic>=2.11",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
blake3 = ["blake3>=0.4"]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.11",
    "ruff>=0.6",
    "jsonschema>=4.22",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
ebs = "ebs.cli.main:app"
ebs-runner = "ebs.runner.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ebs"]

# --- ruff -------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs", ".claude"]  # design docs hold illustrative, not runnable, code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT", "RUF", "S602", "S604", "S605"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["ebs", "tests"]

# --- mypy -------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_explicit = false   # Pydantic models (see task P0-01 notes)
warn_unreachable = true
mypy_path = "src:."
explicit_package_bases = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]  # test-only dependency without type stubs (P0-04)
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
pythonpath = ["."]
timeout = 120
xfail_strict = true
# markers are registered in tests/conftest.py so pytester runs see them too

# --- coverage ---------------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/ebs"]  # a directory, so never-imported modules count as uncovered

[tool.coverage.paths]
source = ["src/ebs", "*/site-packages/ebs"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
