---
# `molecule test` from deploy/ansible/roles/ebs_postgres. The default sequence includes
# `idempotence`, which fails if the second converge reports any change (R5).
# Needs: pip install "molecule>=24" "molecule-plugins[docker]" ansible-core docker
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: docker
platforms:
  - name: ebs-postgres-molecule
    image: docker.io/library/debian:bookworm
    pre_build_image: false
    dockerfile: Dockerfile.j2
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    host_vars:
      ebs-postgres-molecule:
        # Throw-away test values for the throw-away container.
        ebs_postgres_superuser_password: molecule-superuser
        ebs_postgres_ebs_password: molecule-ebs
        ebs_postgres_replication_password: molecule-replication
        ebs_pgbackrest_cipher_pass: molecule-cipher-key
        ebs_postgres_shared_buffers: 128MB
        ebs_postgres_effective_cache_size: 512MB
verifier:
  name: ansible
