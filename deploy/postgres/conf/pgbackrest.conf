# EBS pgBackRest configuration (P0-11). The repository is the `pgbackrest-repo` volume, shared by
# the primary and the standby; a site deployment should use a dedicated backup host (repo1-host).
# The repository encryption key comes from PGBACKREST_REPO1_CIPHER_PASS in the environment.

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-retention-diff=6
compress-type=zst
start-fast=y
process-max=2
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[ebs]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
