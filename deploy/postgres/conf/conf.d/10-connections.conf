# Sized for ~100 users + CI behind PgBouncer (transaction pooling, default_pool_size 20).
# Clients connect to PgBouncer; only PgBouncer, replication and admins connect here directly.
max_connections = 100
superuser_reserved_connections = 5

# Abort sessions that sit idle inside a transaction (they hold locks and pin the xmin horizon).
idle_in_transaction_session_timeout = 60s
# The 30 s statement timeout is set on the ebs role (initdb/10-ebs-roles.sh), not server-wide,
# so backups and maintenance run by other roles are not cut off.

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

password_encryption = scram-sha-256

log_connections = on
log_disconnections = on
log_min_duration_statement = 1s
log_line_prefix = '%m [%p] %q%u@%d '
