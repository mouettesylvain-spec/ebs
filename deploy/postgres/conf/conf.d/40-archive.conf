# Continuous WAL archiving to the pgBackRest repository (stanza "ebs"); enables PITR.
archive_mode = on
archive_command = 'pgbackrest --stanza=ebs archive-push %p'
archive_timeout = 60s
# Used by a standby that falls behind and by point-in-time restores.
restore_command = 'pgbackrest --stanza=ebs archive-get %f "%p"'
