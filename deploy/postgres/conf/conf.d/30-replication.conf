# Streaming replication to one hot standby (physical slot "standby1", created at initdb).
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
max_slot_wal_keep_size = 20GB
hot_standby = on
hot_standby_feedback = on
# Lets pg_rewind turn a failed-over primary back into a standby.
wal_log_hints = on
