# TLS with the certificates from scripts/gen-certs.sh (self-signed CA) or a site CA.
# The entrypoint copies them from /certs to /var/lib/postgresql/tls, owner postgres, mode 0600.
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_ca_file = '/var/lib/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
