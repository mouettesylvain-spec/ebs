# EBS PostgreSQL 17 configuration (P0-11). Shared by the primary and the standby; a standby
# gets primary_conninfo / primary_slot_name from `pg_basebackup -R` (postgresql.auto.conf).
# The fragments in conf.d/ are read in name order; put site overrides in a later file.

listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'

include_dir = '/etc/postgresql/conf.d'
