# EBS pg_hba.conf (P0-11). Every network connection must use TLS and SCRAM-SHA-256.
# TYPE      DATABASE     USER        ADDRESS        METHOD

# OS user postgres over the socket: the image entrypoint and pgBackRest.
local       all          postgres                   peer
local       all          all                        scram-sha-256

# Plain-text TCP is refused outright.
hostnossl   all          all         0.0.0.0/0      reject
hostnossl   all          all         ::/0           reject

# Streaming replication (standby) and clients (PgBouncer, admins) on the service network only.
hostssl     replication  replicator  samenet        scram-sha-256
hostssl     all          all         samenet        scram-sha-256
