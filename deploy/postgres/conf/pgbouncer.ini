; EBS PgBouncer configuration (P0-11). The entrypoint copies this file to /run/pgbouncer/,
; replaces @EBS_PG_PRIMARY_HOST@ and writes the userlist from the environment.
; scripts/pgbouncer-switch.sh rewrites the host and reloads PgBouncer after a failover.

[databases]
ebs = host=@EBS_PG_PRIMARY_HOST@ port=5432 dbname=ebs

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /run/pgbouncer

auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
admin_users = postgres
stats_users = ebs

; Transaction pooling: up to 1000 clients share 20 server connections per (db, user).
pool_mode = transaction
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
max_client_conn = 1000
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options

client_tls_sslmode = require
client_tls_cert_file = /run/pgbouncer/tls/server.crt
client_tls_key_file = /run/pgbouncer/tls/server.key
client_tls_ca_file = /run/pgbouncer/tls/ca.crt
server_tls_sslmode = require
server_tls_ca_file = /run/pgbouncer/tls/ca.crt

log_connections = 1
log_disconnections = 1
