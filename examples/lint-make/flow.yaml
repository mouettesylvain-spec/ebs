# Wraps an existing lint Makefile as-is (kind: make), one action per RTL block, and
# summarizes the reports. Runs anywhere: the default linter is tools/fake-lint (bash + awk).
# flow.verilator.yaml runs the same Makefile with real Verilator (docs/user/quickstart.md).
version: 1
project: lint-make
domain: examples

steps:
  lint:
    kind: make
    workdir: lint                          # make -C lint lint BLOCK=<block> LINTER=fake
    target: lint
    matrix: { table: blocks.csv }
    inputs:
      rtl: "rtl/${row.block}/*.sv"
      linter: tools/fake-lint
    params: { BLOCK: "${row.block}", LINTER: fake }
    outputs:
      report: "lint/reports/${row.block}.rpt"  # normalized: identical bytes give early cutoff

  summary:
    kind: shell
    inputs: { tool: tools/summarize }
    command: ["bash", "tools/summarize", "summary.txt", "${steps.lint.outputs.report[*]}"]
    outputs: { summary: summary.txt }
